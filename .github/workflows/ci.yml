name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.14' }
          - { os: macos-latest, python: '3.13' }
          - { os: windows-latest, python: '3.12' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --no-deps .
      - run: spliceledger examples/lesson.srt examples/keep.csv -o demo.zip
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t spliceledger .
      - name: Run offline and verify the written archive
        run: |
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" -v "$PWD:/work" spliceledger /work/examples/lesson.srt /work/examples/keep.csv -o /work/container.zip
          python -c "import zipfile; z=zipfile.ZipFile('container.zip'); assert z.testzip() is None"
